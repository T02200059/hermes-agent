  gateway_timeout_denied: "已拦截：命令{reason}。用户未同意此操作。请勿重试此命令，请勿改写它，也请勿通过其他命令尝试实现相同结果。停止当前工作流，并在采取任何进一步破坏性或不可逆操作之前等待用户回应。{timeout_addendum}"
