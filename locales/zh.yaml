  # 消息处理意外崩溃时向用户显示的通用错误。
  handler_error: "抱歉，发生了错误（{error_type}）。\n{error_detail}\n请重试，或使用 /reset 开始新会话。"

  # Agent 轮次异常兜底（gateway/run.py）。仅按状态码给提示，不暴露异常类型/原文。
  # {status_hint} 为空或 agent_error_hint_* 之一。中文不在 hint 前加空格（句号后直接接续）。
