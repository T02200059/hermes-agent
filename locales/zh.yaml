  agent_error_hint_auth: "请检查 API 密钥，或运行 `claude /login` 刷新 OAuth 凭证。"
  agent_error_hint_billing: "API 余额或额度已用尽，请检查服务商控制台。"
  agent_error_hint_rate_limited: "当前触发了速率限制，请稍后再试。"
