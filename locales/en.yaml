  # Approval-card click failure states (CallBackCard — never silent)
  feishu_fail_unauthorized_title: "⚠️ Not authorized"
  feishu_fail_unauthorized_body: "Your account is not allowed to act on this approval. Use an authorized account, or ask an admin to check FEISHU_GROUP_POLICY / allowlists. **The request is still waiting** — unauthorized clicks do not cancel it."
  feishu_fail_already_resolved_title: "ℹ️ Already handled"
  feishu_fail_already_resolved_body: "This approval was already resolved or has expired. No further action needed."
  feishu_fail_chat_mismatch_title: "⚠️ Invalid click"
  feishu_fail_chat_mismatch_body: "Please click the original approval card in its chat. Do not forward it elsewhere."
  feishu_fail_missing_id_title: "⚠️ Invalid request"
  feishu_fail_missing_id_body: "Missing approval id; this click cannot be processed."
  feishu_fail_submit_failed_title: "⚠️ Submit failed"
  feishu_fail_submit_failed_body: "Could not schedule the approval result. Retry later or re-trigger the action in the original conversation."
  feishu_fail_default_title: "⚠️ Failed"
  feishu_fail_default_body: "The approval action did not take effect. Check logs or contact an admin."
  feishu_permanent_disabled: "💡 Permanent approval is disabled. Choose Allow Once or Session instead."
  # Shown when approvals.mode=smart returns DENY and the owner is asked to
  # override. Session/Always are intentionally unavailable — one override must
  # not authorize the same dangerous pattern for the rest of the conversation.
  feishu_smart_deny_note: "🤖 **Smart DENY:** The smart-approval model assessed this command as genuinely dangerous.\n\nYou can still override, but **only for this single operation**. Session and Always are unavailable so one click cannot weaken protection for similar later commands."
  # QQ has no Session button (once / always / deny only).
  qqbot_permanent_disabled: "💡 Permanent approval is disabled. Choose Allow Once instead."
  yolo_auto_resolved: "🔄 YOLO mode enabled — {count} pending approval(s) auto-resolved."

  # QQBot approval card — interactive card UI text.
  qqbot_exec_title: "🔐 **Command Execution Approval**"
  qqbot_exec_title_smart_deny: "🔐 **Smart DENY — Allow Once Only**"
  qqbot_exec_subtitle: "Execute this command?"
  qqbot_plugin_title: "**Approval Request**"
  qqbot_cwd_label: "📁 Directory: {cwd}"
  qqbot_reason_label: "📝 {description}"
  qqbot_tool_label: "🔧 Tool: {tool_name}"
  qqbot_timeout_label: "⏱️ Timeout: {timeout} seconds"
  qqbot_btn_once: "✅ Allow Once"
  qqbot_btn_always: "⭐ Always Allow"
  qqbot_btn_deny: "❌ Deny"
  qqbot_visited_once: "Allowed"
  qqbot_visited_always: "Always Allowed"
  qqbot_visited_deny: "Denied"
  # Smart DENY owner override: Always Allow is hidden; explain one-shot scope.
  qqbot_smart_deny_note: "🤖 **Smart DENY:** The smart-approval model assessed this command as genuinely dangerous.\n\nYou can still override, but **only for this single operation**. Always Allow is unavailable so one click cannot weaken protection for similar later commands."

  # Generic reason label — used by fallback, Telegram, Discord, Slack.
  reason_label: "Reason: {description}"
  # Security scan prefix (tirith findings)
  scan_prefix: "Security scan"

  # Slash-command confirmation prompts (prompt_toolkit UI).
  # Used by _confirm_destructive_slash (/clear /new /reset /undo) and
  # _confirm_and_reload_mcp (/reload-mcp).
  slash_confirm:
    destructive_title: "⚠️  /{command} — destroys conversation state"
    destructive_detail_default: "This will discard the current conversation history. This cannot be undone."
    mcp_title: "⚠️  /{command} — Prompt cache invalidation warning"
    mcp_detail: >-
      Reloading MCP servers rebuilds the tool set for this session and
      invalidates the provider prompt cache. The next message will
      re-send full input tokens (can be expensive on long-context or
      high-reasoning models).
    choice_once: "Approve Once"
    choice_always: "Always Approve"
    choice_cancel: "Cancel"
    hint_destructive_once: "proceed this time only"
    hint_destructive_always: "proceed and silence this prompt permanently"
    hint_destructive_cancel: "keep current conversation"
    hint_mcp_once: "reload now"
    hint_mcp_always: "reload now and silence this prompt permanently"
    hint_mcp_cancel: "leave MCP tools unchanged"
    cancelled_no_input: "🟡 /{command} cancelled (no input)."
    cancelled_unrecognized: "🟡 Unrecognized choice '{raw}'. /{command} cancelled."
    cancelled_explicit_destructive: "🟡 /{command} cancelled. Conversation unchanged."
    cancelled_explicit_mcp: "🟡 /{command} cancelled. MCP tools unchanged."
    optout_saved_destructive: "🔒 Future /clear, /new, /reset, and /undo will run without confirmation."
    optout_saved_mcp: "🔒 Future /{command} calls will run without confirmation."
    optout_hint_destructive: "   Re-enable via `approvals.destructive_slash_confirm: true` in config.yaml."
    optout_hint_mcp: "   Re-enable via `approvals.mcp_reload_confirm: true` in config.yaml."
    optout_failed_destructive: "⚠️  Couldn't persist opt-out — proceeding once."
    optout_failed_mcp: "⚠️  Couldn't persist opt-out — reloading once."
    reloading_mcp: "🔄 Reloading MCP servers..."
    mcp_config_changed: "🔄 MCP server config changed — reloading connections..."
    reloading_skills: "🔄 Reloading skills..."

