# Hermes static-message catalog -- English (baseline / source of truth)
#
# Only user-facing static messages from the CLI approval prompt and a handful
# of gateway slash-command replies live here.  Agent-generated output, log
# lines, error tracebacks, tool outputs, and slash-command descriptions stay
# in English and are NOT translated -- see agent/i18n.py for scope rationale.
#
# Keys are dotted paths; nesting below is purely for readability.  Values may
# contain {placeholder} tokens for str.format substitution.  When adding a
# new key, add it to EVERY locale file (en/zh/ja/de/es/fr/tr/uk) in the same commit --
# tests/agent/test_i18n.py asserts catalog parity.

approval:
  # CLI approval prompt -- shown when a dangerous command needs user review.
  dangerous_header: "⚠️  DANGEROUS COMMAND: {description}"
  choose_long:     "      [o]nce  |  [s]ession  |  [a]lways  |  [d]eny"
  choose_short:    "      [o]nce  |  [s]ession  |  [d]eny"
  prompt_long:     "      Choice [o/s/a/D]: "
  prompt_short:    "      Choice [o/s/D]: "
  choose_smart_deny: "      [o]nce  |  [d]eny"
  prompt_smart_deny: "      Choice [o/D]: "
  smart_deny_once_inputs: "o,once"
  smart_deny_deny_inputs: "d,deny"
  timeout:         "      ⏱ Timeout - denying command"
  allowed_once:    "      ✓ Allowed once"
  allowed_session: "      ✓ Allowed for this session"
  allowed_always:  "      ✓ Added to permanent allowlist"
  denied:          "      ✗ Denied"
  cancelled:       "      ✗ Cancelled"
  blocklist_message: "This command is on the unconditional blocklist and cannot be approved."

  # CLI approval panel labels (prompt_toolkit UI).
  dangerous_title: "⚠️  Dangerous Command"
  choice_once: "Allow once"
  choice_session: "Allow for this session"
  choice_always: "Add to permanent allowlist"
  choice_deny: "Deny"
  choice_view: "Show full command"
  hint_choose_view: "… (choose Show full command)"
  hint_command_truncated: "… (command truncated — use /logs or /debug for full text)"
  hint_description_truncated: "… (description truncated)"

  # Block/hardline/deny messages — returned to the agent when a command is blocked.
  hardline_blocked: "BLOCKED (hardline): {description}. This command is on the unconditional blocklist and cannot be executed via the agent — not even with --yolo, /yolo, approvals.mode=off, or cron approve mode. If you genuinely need to run it, run it yourself in a terminal outside the agent."
  sudo_stdin_blocked: "BLOCKED: {description}. Do not pipe passwords to 'sudo -S' — this is a brute-force attack vector. Set SUDO_PASSWORD in your .env file if the agent needs passwordless sudo, or run the sudo command manually in your own terminal."
  cron_blocked: "BLOCKED: Command flagged as dangerous ({description}) but cron jobs run without a user present to approve it. Find an alternative approach that avoids this command. To allow dangerous commands in cron jobs, set approvals.cron_mode: approve in config.yaml."
  gateway_asking: "⚠️ This command is potentially dangerous ({description}). Asking the user for approval.\n\n**Command:**\n```\n{command}\n```"
  gateway_asking_combined: "⚠️ {description}. Asking the user for approval.\n\n**Command:**\n```\n{command}\n```"
  user_denied: "BLOCKED: User denied this potentially dangerous command (matched '{description}' pattern). Do NOT retry this command — the user has explicitly rejected it."
  smart_denied: "BLOCKED by smart approval: {description}. The command was assessed as genuinely dangerous. Do NOT retry."
  gateway_notify_failed: "BLOCKED: Failed to send approval request to user. Do NOT retry."
  gateway_timeout_denied: "BLOCKED: Command {reason}. The user has NOT consented to this action. Do NOT retry this command, do NOT rephrase it, and do NOT attempt the same outcome via a different command. Stop the current workflow and wait for the user to respond before taking any further destructive or irreversible action.{timeout_addendum}"
  cli_denied: "BLOCKED: User denied this command. The user has NOT consented to this action. Do NOT retry this command, do NOT rephrase it, and do NOT attempt the same outcome via a different command. Stop the current workflow and wait for the user to respond before taking any further destructive or irreversible action."
  execute_code_smart_denied: "BLOCKED by smart approval: execute_code script execution was assessed as genuinely dangerous. Do NOT retry."
  execute_code_gateway_asking: "⚠️ {description}. Asking the user for approval.\n\n**Code:**\n```python\n{code}\n```"
  execute_code_notify_failed: "BLOCKED: Failed to send execute_code approval request to user. Do NOT retry."
  execute_code_timeout_denied: "BLOCKED: execute_code script timed out without user response. The user has NOT consented to running this code. Do NOT retry, do NOT rephrase the script, and do NOT attempt the same outcome via a different tool. Silence is not consent."
  execute_code_user_denied: "BLOCKED: execute_code script denied by user. The user has NOT consented to running this code. Do NOT retry, do NOT rephrase the script, and do NOT attempt the same outcome via a different tool."

  # Feishu approval card — interactive card UI text.
  feishu_card_title: "⚠️ Command Approval Required"
  feishu_card_title_smart_deny: "⚠️ Smart DENY — Allow Once Only"
  feishu_reason_label: "**Reason:** {description}"
  feishu_btn_once: "✅ Allow Once"
  feishu_btn_session: "✅ Session"
