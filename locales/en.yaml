  feishu_update_yes: "Yes"
  feishu_update_no: "No"
  feishu_update_title: "Update prompt answered: {label}"
  feishu_update_body: "Answered by **{user_name}**"

gateway:
  # Messenger replies to slash commands and implicit state changes.
  approval_expired: "⚠️ Approval expired (agent is no longer waiting). Ask the agent to try again."
  # {profile_tag} is "" for default, or " [<name>]" for named/custom profiles.
  draining:         "⏳{profile_tag} Draining {count} active agent(s) before restart..."
  goal_cleared:     "✓ Goal cleared."
  no_active_goal:   "No active goal."
  config_read_failed: "⚠️ Could not read config.yaml: {error}"
  config_save_failed: "⚠️ Could not save config: {error}"
  silent_api_disconnect: "⚠️ The API connection dropped before any response arrived. This is usually a transient network or provider issue — please try again."

  # Platform adapter fallback messages — shown when a message cannot be delivered
  # in its original format (rich formatting, attachments, clarify buttons, etc.).
  formatting_failed_prefix: "(Response formatting failed, plain text:)"
  delivery_failed_notice: "⚠️ Message delivery failed after multiple attempts. Please try again — your request was processed but the response could not be sent."
  clarify_question: "❓ {question}"
  clarify_choices: "❓ {question}\n\n{choices}\n\nReply with the number, the option text, or your own answer."
  file_attachment_failed: "⚠️ Couldn't deliver the file attachment."
  file_attachment_failed_with_name: "⚠️ Couldn't deliver the file attachment ({file_name})."

  # Generic error shown to the user when message processing crashes unexpectedly.
  handler_error: "Sorry, I encountered an error ({error_type}).\n{error_detail}\nTry again or use /reset to start a fresh session."

  # Background task completion/failure notifications.
  background_task_complete: "✅ Background task complete\nPrompt: \"{preview}\"\n\n{response}"
  background_task_no_response: "(No response generated)"
  background_task_error_prefix: "Error: {error}"
  background_task_failed: "❌ Background task {task_id} failed: {error}"

  # Gateway lifecycle messages — shown during restart/shutdown/draining.
  # {profile_tag} is "" for the default profile, or " [<name>]" for named/custom.
  shutdown_notify_restart: "🌆 Gateway{profile_tag} restarting — Your current task will be interrupted. Send any message after restart and I'll try to resume where you left off."
  shutdown_notify_stop:    "⚠️ Gateway{profile_tag} shutting down — Your current task will be interrupted."
  restart_success:         "🌃 Gateway{profile_tag} restarted successfully. Your session continues."
  online:                  "🏙 Gateway{profile_tag} online — Hermes is back and ready."

  # Busy-ack messages — shown when the user sends a message while the agent is running/draining.
  busy_drain_queued:       "⏳ Gateway{profile_tag} {action} — queued for the next turn after it comes back."
  busy_drain_not_accepting: "⏳ Gateway{profile_tag} is {action} and is not accepting another turn right now."
  busy_drain_no_work:      "⏳ Gateway{profile_tag} is {action} and is not accepting new work right now."
  busy_drain_maintenance:  "⏳ This agent{profile_tag} is draining for a maintenance action and isn't accepting new turns right now. It'll be back in a moment — please resend shortly."
  busy_steer_ack:          "⏩ Steered into current run{status_detail}. Your message arrives after the next tool call."
  busy_queue_ack:          "⏳ Queued for the next turn{status_detail}. I'll respond once the current task finishes."
  busy_interrupt_ack:      "⚡ Interrupting current task{status_detail}. I'll respond to your message shortly."
  busy_subagent_queued:    "⏳ Subagent working{status_detail} — your message is queued for when it finishes (use /stop to cancel everything)."
  busy_compress_queued:    "⏳ Compressing context{status_detail} — your message is queued for when it finishes (use /stop to cancel everything)."

  # Steer command replies.
  steer_failed:            "⚠️ Steer failed: {error}"
  steer_queued:            "⏩ Steer queued — arrives after the next tool call: '{preview}'"
  steer_empty:             "Steer rejected (empty payload)."

  # Force-stop reply.
  force_stop_pending:      "⚡ Force-stopped. The agent was still starting — session unlocked."

  # Long-running / inactivity notifications.
  still_working:           "⏳ Working — {elapsed} min{status_detail}"
  no_activity_warning:     "⚠️ No activity for {elapsed} min. If the agent does not respond soon, it will be timed out in {remaining} min. You can continue waiting or use /reset."

  # Agent timeout diagnostic — shown when a turn is killed for inactivity.
  agent_timeout:           "⏱️ Agent inactive for {timeout_mins} min — no tool calls or API responses.\n{detail}\nTo increase the limit, set agent.gateway_timeout in config.yaml (value in seconds, 0 = no limit) and restart the gateway.\nTry again, or use /reset to start fresh."
  agent_timeout_detail_tool:     "The agent appears stuck on tool `{cur_tool}` ({secs_since}s since last activity, iteration {iter_n}/{iter_max})."
  agent_timeout_detail_activity: "Last activity: {last_desc} ({secs_since}s ago, iteration {iter_n}/{iter_max}). The agent may have been waiting on an API response."

  # Agent-running guard messages — shown when a slash command is blocked while agent is active.
  busy_agent_starting:     "Agent still starting — /steer queued for the next turn."
  busy_no_active_agent:    "No active agent — /steer queued for the next turn."
  busy_model_blocked:      "Agent is running — wait or /stop first, then switch models."
  busy_codex_runtime_blocked: "Agent is running — wait or /stop first, then change runtime."
  busy_goal_blocked:       "Agent is running — use /goal status / pause / clear / wait mid-run, or /stop before setting a new goal."
  busy_cmd_blocked:        "⏳ Agent is running — `/{cmd}` can't run mid-turn. Wait for the current response or `/stop` first."
  unknown_command: "Unknown command `/{command}`. Type /commands to see what's available, or resend without the leading slash to send as a regular message."
  skill_disabled: "The **{skill}** skill is installed but disabled.
Enable it with: `hermes skills config`"
  skill_disabled_for_platform: "The **{skill}** skill is disabled for {platform}.
Enable it with: `hermes skills config`"
  skill_not_installed: "The **{skill}** skill is available but not installed.
Install it with: `hermes skills install {path}`"

  # Command usage hints.
  queue_usage:             "Usage: /queue <prompt>"
  queue_queued:            "Queued for the next turn."
  queue_queued_with_depth: "Queued for the next turn. ({depth} queued)"
  steer_usage:             "Usage: /steer <prompt>"
  steer_usage_no_agent:    "Usage: /steer <prompt>  (no agent is running; sending as a normal message)"
  learn_failed:            "Could not start /learn — please try again."
  quick_command_timeout:   "Quick command timed out (30s)."
  quick_command_no_output: "Command returned no output."
  quick_command_error: "Quick command error: {error}"
  quick_command_no_command: "Quick command '/{command}' has no command defined."
  quick_command_no_target: "Quick command '/{command}' has no target defined."
  quick_command_unsupported_type: "Quick command '/{command}' has unsupported type (supported: 'exec', 'alias')."
  hook_blocked: "Command `/{command}` was blocked by a hook."
  processing_stopped: "⚠️ Processing stopped: {error}. Try again."
  suggestions_failed: "Suggestions command failed: {error}"
  moa_prepare_failed: "Failed to prepare MoA turn."
  chained_commands_executed: "Commands executed."

  # Session auto-reset notice — shown when a stale session is cleared on new activity.
  session_reset_notice: "◐ Session automatically reset ({reason}). Conversation history cleared.\nUse /resume to browse and restore a previous session.\nAdjust reset timing in config.yaml under session_reset."
  session_reset_reason_suspended: "previous session was stopped or interrupted"
  session_reset_reason_resume_expired: "gateway restart recovery timed out"
  session_reset_reason_daily: "daily schedule at {hour}:00"
  session_reset_reason_idle: "inactive for {duration}"

  # Operation interrupted placeholders -- shown when a turn is cut short
  # (user /stop, API error retry, gateway restart, etc.) and no visible
  # assistant text was produced. The default placeholder is a bare status
  # line; the friendly variant adds actionable suggestions.
  interrupt:
    placeholder: "Operation interrupted."
    friendly: >-
      Operation interrupted. The model returned no visible response.
      Try /new to start a fresh conversation, or switch models with /model.
      If the issue persists, the current model may not support this workload.

  # Interrupt with context -- retry/error-specific variants.
  interrupt_retry: "Operation interrupted during retry ({reason}, attempt {attempt}/{max})."
  interrupt_api_error: "Operation interrupted: handling API error ({error_type}: {error_detail}). Try again later or switch models with /model."
  interrupt_retry_after_error: "Operation interrupted: retrying API call after error (retry {attempt}/{max})."

  # Goal/subgoal usage.
  goal_usage_wait:  "Usage: /goal wait <pid> [reason]"
  goal_no_wait_barrier: "No wait barrier set."
  goal_usage_draft: "Usage: /goal draft <objective in plain language>"
  goal_no_active:   "No active goal. Set one with /goal <text>."
  subgoal_usage_remove: "Usage: /subgoal remove <n>"
  subgoal_no_subgoals: "No subgoals to clear."

  # Turn-completion explanations — appended to the assistant reply when a turn
  # ends abnormally (empty after retries, partial stream, budget exhausted,
  # pending tool result, etc.) so the user is never left with a silent turn.
  turn_explainer:
    prefix: "⚠️ No reply: "
    empty_response_exhausted: "the model returned empty content after retries and any fallback providers. Try `continue`, switch model/provider, or inspect the tool output above."
    all_retries_exhausted: "all API retries were exhausted before a response was produced (provider errors / rate limits). Try `continue` or switch provider."
    partial_stream_recovery: "streaming stopped early and only a partial response was recovered. Send `continue` to resume from where it stopped."
    fallback_prior_turn: "no new content was produced this turn; showing recovered prior context. Send `continue` to retry."
    interrupted_during_api_call: "the request was interrupted mid-call before a reply was received. Send `continue` to retry."
    budget_exhausted: "the per-turn iteration/cost budget was exhausted before a final answer. Send `continue` to keep going."
    ollama_context_too_small: "the local model's context window was too small to finish. Increase the context size or use a larger model."
    max_iterations: "the maximum tool-iteration limit was reached before a final answer. Send `continue` to keep going, or raise `max_iterations`."
    error_near_max_iterations: "an error occurred near the iteration limit before a final answer. Check the tool output above, then send `continue`."
    pending_tool_result: "the turn stopped while a tool result was still pending and the model produced no follow-up text. Send `continue` to let it summarize."

  # User-facing error messages assigned to _final_response when a turn fails
  # terminally (API errors, payload/context limits, billing exhaustion, etc.).
  error:
    invalid_api_response: "Invalid API response after {max_retries} retries: {failure_hint}"
    payload_too_large_max_compression: "Request payload too large: max compression attempts ({max_compression_attempts}) reached."
    payload_too_large_413: "Request payload too large (413). Cannot compress further."
    context_exceeded_max_compression: "Context length exceeded: max compression attempts ({max_compression_attempts}) reached."
    context_exceeded_tokens: "Context length exceeded ({new_tokens} tokens). Cannot compress further."
    billing_exhausted: "Billing or credits exhausted: {final_summary}. Check your account balance or configure a fallback provider."
    api_failed_after_retries: "API call failed after {max_retries} retries: {final_summary}"
    invalid_tool_call: "Model generated invalid tool call: {invalid_preview}. Try switching models with /model or start fresh with /new."
    repeated_errors: "I apologize, but I encountered repeated errors: {error_msg}"

  # Runtime status messages — emitted during the conversation loop via
  # _emit_status / _buffer_status / _safe_print. Keep command names literal.
  runtime:
    ollama_context_too_small: "❌ Ollama runtime context is too small for Hermes tool use"
    pre_api_compression: "📦 Pre-API compression: ~{tokens} tokens near the context/output limit. Compacting before the next model call."
    preflight_compression: "📦 Preflight compression: ~{tokens} tokens >= {threshold} threshold. This may take a moment."
    compaction: "🗜️ {marker} — summarizing earlier conversation so I can continue..."
    stale_connections: "🔌 Detected stale connections from a previous provider issue — cleaned up automatically. Proceeding with fresh connection."
    fallback_trying: "⚠️ Max retries ({max_retries}) exhausted — trying fallback..."
    fallback_empty_malformed: "⚠️ Empty/malformed response — switching to fallback..."
    fallback_rate_limited: "⚠️ Rate limited — switching to fallback provider..."
    fallback_upstream_rate_limited: "⚠️ Upstream {upstream} rate-limited — switching to fallback model..."
    fallback_billing_exhausted: "⚠️ Billing or credits exhausted — switching to fallback provider..."
    fallback_provider_unreachable: "⚠️ Provider unreachable — switching to fallback provider..."
    fallback_non_retryable: "⚠️ Non-retryable error (HTTP {status_code}) — trying fallback..."
    max_retries_invalid_response: "❌ Max retries ({max_retries}) exceeded for invalid responses. Giving up."
    compressed_messages: "🗜️ Compressed {before} → {after} messages, retrying..."
    compressed_tokens: "🗜️ Compressed ~{before_tokens} → ~{after_tokens} tokens, retrying..."
    payload_too_large_compressing: "⚠️ Request payload too large (413) — compression attempt {current}/{total}..."
    context_too_large_compressing: "🗜️ Context too large (~{tokens} tokens) — compressing ({current}/{total})..."
    empty_response_fallback: "↻ Empty response after tool calls — using earlier content as final answer"
    retrying_in: "⏳ Retrying in {wait_time}s (attempt {attempt}/{max})..."
    status_billing_exhausted: "❌ Billing or credits exhausted — {summary}"
    status_rate_limited: "❌ Rate limited after {max_retries} retries — {summary}"
    status_api_failed: "❌ API failed after {max_retries} retries — {summary}"
    tool_loop_interrupt: "⚡ Breaking out of tool loop due to interrupt..."
    compacting_context_progress: "⟳ compacting context…"
    conversation_completed: "🎉 Conversation completed after {count} OpenAI-compatible API call(s)"
    cached_context_length: "💾 Cached context length: {ctx} tokens for {model}"
    starting_conversation: "💬 Starting conversation: '{preview}{ellipsis}'"
    codex_no_first_byte: "⚠️ No first byte from provider in {elapsed}s (codex stream, model: {model}). Reconnecting."
    codex_no_first_byte_with_hint: "⚠️ No first byte from provider in {elapsed}s (codex stream, model: {model}). Reconnecting. {hint}"
    codex_stream_idle: "⚠️ Codex stream sent no events for {elapsed}s after first byte (model: {model}). Reconnecting."
    provider_no_response: "⚠️ No response from provider for {elapsed}s (non-streaming, model: {model}). Aborting call."
    provider_no_response_with_hint: "⚠️ No response from provider for {elapsed}s (non-streaming, model: {model}). {hint}"
    fallback_primary_failed: "🔄 Primary model failed — switching to fallback: {model} via {provider}"
    bedrock_stream_denied: "⚠  AWS IAM denied bedrock:InvokeModelWithResponseStream — falling back to non-streaming InvokeModel. Grant that action to restore streaming output."
    streaming_unsupported: "⚠  Streaming is not supported for this model/provider. Switching to non-streaming. To avoid this delay, set display.streaming: false in config.yaml"
    stream_malformed: "❌ Provider returned malformed streaming data after {attempts} attempts. The provider may be experiencing issues — try again in a moment."
    stream_connection_failed: "❌ Connection to provider failed after {attempts} attempts. The provider may be experiencing issues — try again in a moment."
    stream_no_response: "⚠️ No response from provider for {elapsed}s (model: {model}, context: ~{tokens} tokens). Reconnecting..."

  # Telegram topic messages.
  chat_id_unknown:       "Could not determine chat ID."
  session_not_found: "Session not found: {name}"
  default_chat_name:     "Hermes Chat"
  topic_mode_disabled:   "Multi-session topic mode is not currently enabled for this chat."
  topic_disabled: "Multi-session topic mode is now OFF for this chat.\n\nExisting topics in Telegram aren't removed — they'll just stop being gated as independent sessions. The root DM works as a normal Hermes chat again. Run /topic to re-enable later."
  topic_disable_failed: "Failed to disable topic mode: {error}"
  topic_not_telegram_session: "That session is not a Telegram session and cannot be restored into this topic."
  topic_wrong_user:      "That session does not belong to this Telegram user."
  topic_already_linked:  "That session is already linked to another Telegram topic."

  # Discord voice channel messages.
  voice_not_supported:     "Voice channels are not supported on this platform."
  voice_discord_only:      "This command only works in a Discord server."
  voice_not_in_channel:    "You need to be in a voice channel first."
  voice_join_failed:       "Failed to join voice channel. Check bot permissions (Connect + Speak)."
  voice_left:              "Left voice channel."
  voice_joined: "Joined voice channel **{channel}**.\nI'll speak my replies and listen to you. Use /voice leave to disconnect."
  voice_deps_missing: "Voice dependencies are missing (PyNaCl / davey). Install with: `{command}`"
  voice_not_connected: "Not in a voice channel."
  voice_join_failed_with_error: "Failed to join voice channel: {error}"

  # /model command output -- shown after a model switch or when listing models.
  # Provider names, model IDs, capability strings, and cost figures are NOT
  # translated -- they're identifiers/values, not prose.  Only the labels
  # ("Provider:", "Context:", etc.) and the help/footer lines are localized.
  model:
    error_prefix:           "Error: {error}"
    code_skew_restart_required: "This gateway{profile_tag} is running code from {boot_rev} but the checkout on disk is now {disk_rev}. Switching models would risk a stale-module crash — restart the gateway to load the new code: hermes gateway restart"
    rate_limited: "⏱️ The model provider is rate-limiting requests. Please wait a moment and try again."
    switched:               "Model switched to `{model}`"
    provider_label:         "Provider: {provider}"
    context_label:          "Context: {tokens} tokens"
    max_output_label:       "Max output: {tokens} tokens"
    cost_label:             "Cost: {cost}"
    capabilities_label:     "Capabilities: {capabilities}"
    prompt_caching_enabled: "Prompt caching: enabled"
    warning_prefix:         "Warning: {warning}"
    saved_global:           "Saved to config.yaml (`--global`)"
    session_only_hint:      "_(session only — add `--global` to persist)_"
    current_label:          "Current: `{model}` on {provider}"
    current_tag:            " (current)"
    more_models_suffix:     " (+{count} more)"
    usage_switch_model:     "`/model <name>` — switch model"
    usage_switch_provider:  "`/model <name> --provider <slug>` — switch provider"
    usage_persist:          "`/model <name> --global` — persist"

    # /new and /reset session info card ("◆ Model: …" block shown on every
    # new session; /info reuses this too). Labels/prose only — model IDs,
    # provider slugs, token counts are passed as parameters, NOT translated.
    info_model:             "◆ Model: `{model}`"
    info_provider:          "◆ Provider: {provider}"
    info_context:           "◆ Context: {ctx} tokens ({source})"
    info_endpoint:          "◆ Endpoint: {base_url}"
    ctx_source_config:      "config"
    ctx_source_default:     "default — set model.context_length in config to override"
    ctx_source_detected:    "detected"

    # Content-policy refusal messages (finish_reason=content_filter / provider moderation)
    content_policy_recovery_hint:     "Try rephrasing the request, narrowing the context, or adding a fallback provider with `hermes fallback add`."
    content_policy_trying_fallback:   "Model declined to respond (safety refusal) — trying fallback..."
    content_policy_refusal_status:    "The model declined to respond to this request (safety refusal)."
    content_policy_refusal_response:  "The model declined to respond to this request (safety refusal — not a Hermes/gateway failure)."
    content_policy_explanation:       "Model's explanation: {explanation}"
    content_policy_no_explanation:    "The model returned no explanation."
    content_policy_provider_blocked:  "The model provider's safety filter blocked this request (not a Hermes/gateway failure)."
    content_policy_provider_message:  "Provider message: {message}"
    content_policy_provider_trying_fallback: "Provider safety filter blocked this request — trying fallback..."

    # Model validation messages (from validate_requested_model / model_switch)
    validation_empty:                "Model name cannot be empty."
    validation_no_spaces:            "Model names cannot contain spaces."
    validation_moa_not_found:        "MoA preset `{requested}` was not found. Run `hermes moa list`."
    validation_moa_read_error:       "Could not read MoA presets: {error}"
    validation_auto_corrected:       "Auto-corrected `{requested}` → `{corrected}`"
    validation_invalid_model:        "Invalid model"
    validation_could_not_validate:   "Could not validate `{model}`: {error}"
    validation_not_found_in_provider: "Model `{requested}` was not found in this provider's model listing."
    validation_lmstudio_auth:        "Set `LM_API_KEY` (or update it) to match the server's bearer token."
    validation_lmstudio_unreachable: "Could not reach LM Studio's `/api/v1/models` to validate `{requested}`."
    validation_lmstudio_no_models_1: "LM Studio is reachable but no chat-capable models are loaded. "
    validation_lmstudio_no_models_2: "Load `{requested}` in LM Studio (Developer tab → Load Model) and try again."
    validation_lmstudio_not_found:   "Model `{requested}` was not found in LM Studio's model listing."
    validation_custom_not_found_1:   "Note: `{requested}` was not found in this custom endpoint's model listing ({url}). "
    validation_custom_not_found_2:   "It may still work if the server supports hidden or aliased models."
    validation_custom_fallback:      "\n  Endpoint verification succeeded after trying `{url}`. Consider saving that as your base URL."
    validation_custom_unreachable:   "Note: could not reach this custom endpoint's model listing at `{url}`. "
    validation_custom_unreachable_2: "Hermes will still save `{requested}`, but the endpoint should expose `/models` for verification."
    validation_custom_anthropic_note: "\n  Many Anthropic-compatible proxies do not implement the Models API (GET /v1/models).  The model name has been accepted without verification."
    validation_custom_suggested_url: "\n  If this server expects `/v1`, try base URL: `{url}`"
    validation_codex_not_plausible:  "`{requested}` doesn't look like a {provider_label} model and isn't in its listing, so it was not accepted. If it belongs to another configured provider, switch with `--provider <slug>` (or select it from the `/model` picker)."
    validation_catalog_not_found:    "Note: `{requested}` was not found in the {provider_label} model listing. "
    validation_catalog_not_found_2:  "It may still work if your account has access to a newer or hidden model ID."
    validation_minimax_not_found:    "Note: `{requested}` was not found in the MiniMax catalog."
    validation_minimax_no_models_endpoint: "\n  MiniMax does not expose a /models endpoint, so Hermes cannot verify the model name."
    validation_minimax_may_still_work: "\n  The model may still work if it exists on the server."
    validation_anthropic_not_found:  "Note: `{requested}` was not found in Anthropic's /v1/models listing. "
    validation_anthropic_not_found_2: "It may still work if you have early-access or snapshot IDs."
    validation_anthropic_messages_unverified: "Note: could not verify `{requested}` against this endpoint's model listing.  Many Anthropic-compatible proxies do not implement GET /v1/models.  The model name has been accepted without verification."
    validation_live_not_found_catalog: "Note: `{requested}` was not found in the live /v1/models listing but exists in the curated catalog — accepted."
    validation_bedrock_not_found:    "Note: `{requested}` was not found in Bedrock model discovery for {region}. "
    validation_bedrock_not_found_2:  "It may still work with custom inference profiles or cross-account access."
    validation_catalog_fallback_not_found: "Note: `{requested}` was not found in the {provider_label} curated catalog and the /models endpoint was unreachable."
    validation_catalog_fallback_may_work: "\n  The model may still work if it exists on the provider."
    validation_api_unreachable:      "Note: could not reach the {provider_label} API to validate `{requested}`. If the service isn't down, this model may not be valid."
    validation_hermes_non_agentic:   "Nous Research Hermes 3 & 4 models are NOT agentic and are not designed for use with Hermes Agent. They lack the tool-calling capabilities required for agent workflows. Consider using an agentic model instead (Claude, GPT, Gemini, DeepSeek, etc.)."
    # Model switch errors (from model_switch.py)
    switch_unknown_provider:         "Unknown provider '{provider}'. Check 'hermes model' for available providers, or define it in config.yaml under 'providers:'."
    switch_config_issues:            "\n\nRun 'hermes doctor' — config issues detected:"
    switch_alias_no_credentials:     "Provider '{alias}' is an alias that routes through {provider}, which has no credentials configured.{hint}"
    switch_no_model_detected:        "No model detected on {provider} ({base_url}). Specify the model explicitly: /model <model-name> --provider {provider_slug}"
    switch_no_base_url:              "Provider '{provider}' has no base URL configured. Specify a model: /model <model-name> --provider {provider_slug}"
    switch_alias_not_found:          "Alias '{alias}' maps to {vendor}/{family} but no matching model was found in any provider catalog. Try specifying the full model name."
    switch_multiple_providers:       "'{model}' is declared by multiple configured providers ({providers}). Re-run with --provider <slug> to choose which one to use."
    switch_credential_error:         "Could not resolve credentials for provider '{provider}': {error}"

    # Gateway provider error replies (from _gateway_provider_error_reply and
    # related agent-result error paths in gateway/run.py). These are the short
    # user-safe messages shown when the model provider fails — raw error detail
