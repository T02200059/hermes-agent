# Owner customization layer (runtime: ~/.hermes/overlay.yaml → this file via symlink).
#
# v2 shape: NO outer shell (no top-level "owner:" / "patch:" / "overlay:"). First-level keys ARE
# the sections. Code hangs them under config.owner.xxx after fuse with official config.
# See owner/docs/v2背景说明.md「全局性 / 规范性备忘」and owner/docs/二次开发规范.md §2.2.1.
# Filename is overlay.yaml (not patch.yaml) so v2 stays isolated from the legacy owner-branch patch.yaml.
#
# Hygiene: yaml 只留真覆盖；与代码 DEFAULTS 相同的键已删（stream_guard / openviking /
# output_guard / explainers 共用默认 / checkpoints 除 timeout / queue_card.enabled /
# feishu_card.split_* / notice_titles 等）。缺省行为见各模块 DEFAULTS。
# 本机不写 fleet_profiles / user_routing（留给 C05b）。

# ── C11 飞书 auto-card ───────────────────────────────────────────────────────
# notice_titles 默认表在 owner/feishu/auto_card._DEFAULT_NOTICE_RULES（含 recap）；
# 覆盖为「整表替换」，非追加。
feishu_card:
  auto_card_threshold: 57

# ── 飞书行为 ────────────────────────────────────────────────────────────────
feishu:
  # C09 skill_manage 写审批门（默认关；chat_id 来自旧树迁移）
  skill_approval:
    enabled: false
    profiles:
      - "*"
    allow_skills:
      - xy-*
    approval_home_chat_id: oc_f206b3d2a547a12f430593ea44076031
    timeout_seconds: 86400
    disable_background_skill_review: true
  # C11-bot-menu：menu_v6 key → 命令；缺 key 回退 BUILTIN_BOT_MENU
  bot_menu:
    new: "/new"
    status: "/status"
    usage: "/usage"
    insights: "/insights"
    stop: "/stop"
    reasoning_off: "/reasoning off --global"
    reasoning_medium: "/reasoning medium --global"
    reasoning_high: "/reasoning high --global"
    model_max: "/model qwen3.7-max --provider damodel"
    model_pro: "/model deepseek-v4-pro --provider damodel"
    model_flash: "/model deepseek-v4-flash --provider damodel"
    model_xy_damodel_session: "/model xy-damodel --provider damodel --session"
    model_xy_flash_session: "/model xy-flash --provider damodel --session"
    model_xy_max_session: "/model xy-max --provider damodel --session"
    model_xy_pro_session: "/model xy-pro --provider damodel --session"
    model_xy_damodel_global: "/model xy-damodel --provider damodel --global"
    model_xy_flash_global: "/model xy-flash --provider damodel --global"
    model_xy_max_global: "/model xy-max --provider damodel --global"
    model_xy_pro_global: "/model xy-pro --provider damodel --global"
    list_models: "/providers"
    feishu_guide: "/feishu-guide"
    yolo_on: "/yolo on"
    yolo_off: "/yolo off"
    resume: "/resume"
    agents: "/agents"
  # 点击即时 ack；ack: null = 该 key 不发 ack
  bot_menu_dedup:
    enabled: true
    default_ack: "⏳ 已收到…"
    per_key:
      new:
        ack: "🆕 重置会话中…"
      stop:
        ack: null
      status:
        ack: null
      usage:
        ack: "📊 统计用量中…"
      insights:
        ack: "💡 生成洞察中…"
      reasoning_off:
        ack: "⚙️ 切换推理模式…"
      reasoning_medium:
        ack: "⚙️ 切换推理模式…"
      reasoning_high:
        ack: "⚙️ 切换推理模式…"
      model_flash:
        ack: "🤖 切换模型…"
      model_pro:
        ack: "🤖 切换模型…"
      model_max:
        ack: "🤖 切换模型…"
      model_xy_damodel_session:
        ack: "🤖 切换 xy-damodel（当前会话）…"
      model_xy_flash_session:
        ack: "🤖 切换 xy-flash（当前会话）…"
      model_xy_max_session:
        ack: "🤖 切换 xy-max（当前会话）…"
      model_xy_pro_session:
        ack: "🤖 切换 xy-pro（当前会话）…"
      model_xy_damodel_global:
        ack: "🤖 切换 xy-damodel（全局）…"
      model_xy_flash_global:
        ack: "🤖 切换 xy-flash（全局）…"
      model_xy_max_global:
        ack: "🤖 切换 xy-max（全局）…"
      model_xy_pro_global:
        ack: "🤖 切换 xy-pro（全局）…"
      resume:
        ack: "📋 恢复会话中…"
      agents:
        ack: "👥 查询运行中 agents 和任务…"
      list_models:
        ack: "📋 读取模型列表…"
      feishu_guide:
        ack: "🎛 弹出对话引导卡片…"
      yolo_on:
        ack: "🔓 开启 YOLO 模式…"
      yolo_off:
        ack: "🔒 关闭 YOLO 模式…"

# ── C17 checkpoints：仅保留相对代码默认的真覆盖 ─────────────────────────────
# 默认 predict_enabled=true / cache_size=32 / static_threshold=1；LLM 超时默认 3000ms。
checkpoints:
  predict_llm_timeout_ms: 20000

# ── C13 explainers：代码默认 enabled=false；本机打开 + 平台门 ────────────────
# 共用 provider/model/timeout_ms/max_input_chars 走代码默认（auto / 30s / 64000）。
# kind 内与 registry defaults 相同的数值已省略。
explainers:
  progress:
    enabled: true
    platforms:
      feishu: true
      telegram: false
  approval:
    enabled: true
    platforms:
      feishu: true
  english:
    enabled: true
    platforms:
      feishu: true
      telegram: false
  recap:
    enabled: true
    platforms:
      feishu: true
      telegram: false
    auto:
      enabled: true
      min_user_turns: 3
      idle_seconds: 180
      # OR with turns: latest visible assistant reply length; 0 = off
      min_assistant_chars: 800

# ── C06 LDAP（API identity 门；仓内默认关）──────────────────────────────────
# 连接字段可进仓；勿写密码。启用：enabled:true 或 HERMES_LDAP_ENABLED=1。
# 本机不写 fleet_profiles/user_routing；node010 路由仍可能回落 patch_feishu_profile。
ldap:
  enabled: false
  host: "10.10.100.150"
  port: 389
  use_ssl: false
  timeout_seconds: 5
  user_dn_template: "cn={login},cn=people,dc=westhpc,dc=com"
  enforce: "always"          # off | always | seen(=always 别名)
  cache_ttl_hours: 72
  negative_cache_seconds: 10
  fail_open_on_error: false

# image-hub 已迁 owner.image_hub；provider 选择仍在 config.yaml:image_gen，以下为 overlay 预设。
# 密钥仅引用环境变量；检索时不展开或输出值。
image_gen:
  current: dashscope-qwen
  presets:
    # ── 文生图 (text-to-image) ────────────────────────────────────────
    dashscope-qwen:        # alias: qwen
      alias:
        - qwen
      endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
      model: qwen-image-2.0
      api_key: ${DASHSCOPE_API_KEY}
    dashscope-qwen-pro:    # alias: qwen-pro  (Pro 增强,2026-04 新版)
      alias:
        - qwen-pro
      endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
      model: qwen-image-2.0-pro-2026-04-22
      api_key: ${DASHSCOPE_API_KEY}
    dashscope-wan:         # alias: wan  (通义文生图,基础)
      alias:
        - wan
      endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
      model: wan2.6-t2i
      api_key: ${DASHSCOPE_API_KEY}
    dashscope-wan2-pro:    # alias: wan2  (Wan 2.7 Pro,高质量)
      alias:
        - wan2
      endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
      model: wan2.7-image-pro
      api_key: ${DASHSCOPE_API_KEY}

    # ── 图片编辑 (image-to-image / editing) ───────────────────────────
    # 使用方法:image_generate(prompt, image_url=<源图>, model="image-edit")
    # qwen-image-edit 系列支持 mask 涂抹式编辑和 instruction 指令式编辑
    dashscope-image-edit:  # alias: image-edit
      alias:
        - image-edit
      endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
      model: qwen-image-edit-plus
      api_key: ${DASHSCOPE_API_KEY}
