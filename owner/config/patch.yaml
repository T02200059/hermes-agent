owner:
  approvals:
    allow_permanent: false
    command_allowlist: []
    skill_script_allowlist:
    - extensions:
      - .sh
      - .py
      paths: []
      skill: xy-info
    - extensions:
      - .sh
      - .py
      paths: []
      skill: xy-ansible
    - extensions:
      - .sh
      - .py
      paths: []
      skill: xy-damodel
    - extensions:
      - .sh
      - .py
      paths: []
      skill: xy-gitlab
    - extensions:
      - .sh
      - .py
      paths: []
      skill: xy-alert
    - extensions:
      - .sh
      - .py
      paths: []
      skill: xy-gpu
    - extensions:
      - .sh
      - .py
      paths: []
      skill: xy-storage
    - extensions:
      - .sh
      - .py
      paths: []
      skill: xy-diagnose
    - extensions:
      - .sh
      - .py
      paths: []
      skill: network-tool
  checkpoints:
    predict_cache_size: 32
    predict_enabled: true
    predict_llm_timeout_ms: 20000
    predict_static_threshold: 1
  display_hook_message_receive:
    enabled: true
    mode: before_agent
  feishu:
    bot_menu:
      inspect_gpu_cluster: 帮我根据 sre-king 启动 GPU 集群巡检流程，先问我 IP 范围，等我确认后再执行
      list_models: /providers
      model_flash: /model deepseek-v4-flash --provider damodel
      model_max: /model qwen3.7-max --provider damodel
      model_mimo: /model mimo-v2.5-pro --provider xiaomi --global
      model_minimax: /model MiniMax-M3 --provider minimax-cn --global
      model_pro: /model deepseek-v4-pro --provider damodel
      new: /new
      reasoning_high: /reasoning xhigh --global
      reasoning_medium: /reasoning medium --global
      reasoning_off: /reasoning off --global
      resume: /resume
      status: /status
      stop: /stop
      sync_git_hermes: 帮我同步 hermes-agent 代码：1) 检查 git status 确认无遗留；2) 按功能拆分成多个有意义的
        commit；3) 确认全程在当前分支操作；4) push 到 github 和 gitlab。开始前先告诉我你的计划。
      sync_sre_king: 帮我同步本地 sre-king 目录代码，流程如下：1) 定位本地 sre-king 目录（~/.hermes/skills/westcloud/sre-king/）；2)
        检查是否为 git 仓库，不是则停止并提示；3) 检查当前分支对远端是否有 push 权限，无权限则停止并提示；4) 检查本地未提交的改动，按功能合理拆分成一个或多个有意义的
        commit；5) git fetch + git pull 同步远端当前分支；6) 如有冲突 → 停下来描述冲突文件，询问我如何解决；无冲突 →
        直接 push。开始前先告诉我你的计划，每步执行后汇报结果。
      yolo_off: /yolo off
      yolo_on: /yolo on
    bot_menu_dedup:
      default_ack: ⏳ 已收到…
      enabled: true
      per_key:
        inspect_gpu_cluster:
          ack: 🔍 启动 GPU 集群巡检流程中…
        list_models:
          ack: 📋 读取模型列表…
        model_flash:
          ack: 🤖 切换模型…
        model_max:
          ack: 🤖 切换模型…
        model_mimo:
          ack: 🤖 切换 mimo-v2.5-pro…
        model_minimax:
          ack: 🤖 切换 MiniMax-M3…
        model_pro:
          ack: 🤖 切换模型…
        new:
          ack: 🔄 新建会话中…
        reasoning_high:
          ack: ⚙️ 切换推理模式…
        reasoning_medium:
          ack: ⚙️ 切换推理模式…
        reasoning_off:
          ack: ⚙️ 切换推理模式…
        resume:
          ack: 📋 恢复会话中…
        status:
          ack: null
        stop:
          ack: ⏹️ 停止当前任务…
        sync_git_hermes:
          ack: 🔄 同步 hermes-agent 仓库…
        sync_sre_king:
          ack: 📦 同步 sre-king 仓库…
        yolo_off:
          ack: 🔒 关闭 YOLO 模式…
        yolo_on:
          ack: 🔓 开启 YOLO 模式…
  feishu_card:
    auto_card_threshold: 57
    split_enabled: true
    split_max_chars: 24000
  hooks:
    qdrant_memory_recall:
      body_max_chars: 300
      collections:
      - cases
      - entities
      - events
      - patterns
      - preferences
      embed_max_retries: 2
      embed_model: text-embedding-v4
      embed_timeout_sec: 3
      enabled: false
      extra_context_header: '# Retrieved Memory (qdrant 语义召回, top-K 按 cosine 相似度排序)

        以下是从知识库中语义检索到的相关条目，score 为相似度（0-1，越高越相关）：

        '
      include_score: true
      include_source_collection: true
      log_on_empty_recall: false
      min_query_length: 5
      per_collection_k: 3
      per_collection_timeout_sec: 2
      score_threshold: 0.5
      top_k: 3
      total_timeout_sec: 10
  image_gen:
    presets:
      dashscope-qwen:
        alias:
        - qwen
        api_key: ${DASHSCOPE_API_KEY}
        endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
        model: qwen-image-2.0
      dashscope-wan:
        alias:
        - wan
        api_key: ${DASHSCOPE_API_KEY}
        endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
        model: wan2.6-t2i
  mixture_of_agents:
    aggregator_model:
      model: deepseek-v4-pro
      provider: deepseek
      temperature: 0.4
    max_retries: 6
    min_successful_references: 1
    reference_models:
    - model: mimo-v2.5-pro
      provider: xiaomi
      temperature: 0.6
    - model: kimi-k2.7-code
      provider: damodel
      temperature: 1.0
    - model: qwen3.7-plus
      provider: damodel
      temperature: 0.6
    - model: deepseek-v4-flash
      provider: deepseek
      temperature: 0.6
  model_extra_body:
    damodel:
      glm-5:
        thinking:
          clear_thinking: false
          type: enabled
      glm-5.1:
        thinking:
          clear_thinking: false
          type: enabled
      xopglm5:
        enable_thinking: true
      xopglm51:
        enable_thinking: true
      xopkimik26:
        enable_thinking: true
    xfyun:
      astron-code-latest:
        enable_thinking: true
      xopglm5:
        enable_thinking: true
      xopglm51:
        enable_thinking: true
      xopkimik26:
        enable_thinking: true
  openviking_recall_card:
    enabled: true
    feishu_card: true
    qqbot_text: true
  openviking_sync_recall:
    advisory: true
    enabled: true
    search_timeout: 10
