owner:
  feishu_card:
    auto_card_threshold: 57
    split_enabled: true
    split_max_chars: 24000

  # ── Approval configuration ─────────────────────────────────────────────────
  approvals:
    # Whether to show the "Always" (permanent) approval button on Feishu cards.
    # When false, only "Once" / "Session" / "Deny" are shown.
    allow_permanent: false
    # Permanent approval allowlist (merged with config.yaml command_allowlist).
    # Format: "tirith:<rule_id>" or the exact DANGEROUS_PATTERNS description.
    command_allowlist: []
    # [owner] Skill script auto-approval allowlist
    # 匹配逻辑：命令中所有脚本文件名都来自本 session 已加载的 skill 时自动批准。
    skill_script_allowlist:
      - skill: sre-king
        paths: []
        extensions: [".sh", ".py"]
    # command_allowlist:
    #   - "tirith:raw_ip_url"          # suppress internal IP curl/wget approvals

  # ── Image Generation Presets ───────────────────────────────────────────────
  # Presets for the DashScope image-gen plugin (owner/image_gen/dashscope_provider.py).
  # All owner.image_gen.* lives in patch.yaml and is loaded via the unified
  # owner.patch_config (with mtime + 5min periodic refresh).
  #
  # Select the active preset/model via:
  #   owner:
  #     image_gen:
  #       model: qwen          # or "wan"  (preferred for owner custom)
  # Or fall back to main config.yaml image_gen.model for compatibility.
  # Override per-call by passing model="wan" to the image_generate tool.
  # api_key supports ${ENV_VAR} references; expanded at runtime.
  image_gen:
    presets:
      dashscope-qwen:
        alias:
          - qwen
        endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
        model: qwen-image-2.0
        api_key: ${DASHSCOPE_API_KEY}
      dashscope-wan:
        alias:
          - wan
        endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
        model: wan2.6-t2i
        api_key: ${DASHSCOPE_API_KEY}

  # ── Per-chat display overrides ─────────────────────────────────────────────
  # Override display settings for individual chats/groups (highest priority).
  # Intended primarily for gateway messaging platforms (Telegram, Feishu, etc.).
  # CLI sessions usually do not participate in per_chat.
  # The chat_id is the platform's native chat/group identifier.
  # display:
  #   per_chat:
  #     feishu:
  #       oc_xxxxxxxxxxxxxxxx:
  #         tool_progress: off
  #         interim_assistant_messages: false
  #         tool_preview_length: 0
  #         streaming: false

  # ── Gateway Lifecycle Hooks config ────────────────────────────────
  # qdrant-memory-recall: per-turn Qdrant semantic recall hook
  hooks:
    qdrant_memory_recall:
      enabled: true
      top_k: 3
      score_threshold: 0.5
      per_collection_k: 3
      body_max_chars: 300
      min_query_length: 5
      embed_model: text-embedding-v4
      embed_timeout_sec: 3
      embed_max_retries: 2
      collections:
        - cases
        - entities
        - events
        - patterns
        - preferences
      per_collection_timeout_sec: 2
      total_timeout_sec: 10
      include_score: true
      include_source_collection: true
      extra_context_header: >
        # Retrieved Memory (qdrant 语义召回, top-K 按 cosine 相似度排序)

        以下是从知识库中语义检索到的相关条目，score 为相似度（0-1，越高越相关）：
      log_on_empty_recall: false

  # ── display_hook_message_receive ─────────────────────────────────────
  # 控制 message:receive hook 召回的 extra_context 是否也作为 chat 消息投到当前对话。
  # 与 hook 自身的 LLM 拼写行为解耦 —— enabled=false 只关用户侧投送，hook 仍向 LLM 注入。
  # 配置层级：global enabled → per-platform → per-chat，默认全 on。
  display_hook_message_receive:
    enabled: true
    mode: before_agent

  # ── Feishu bot menu key→command mappings ──────────────────────────────────
  # Maps bot menu event_key to slash command or text prompt.
  # Falls back to _BUILTIN_BOT_MENU in feishu.py when config is unavailable.
  feishu:
    bot_menu:
      new: "/new"
      status: "/status"
      stop: "/stop"
      reasoning_off: "/reasoning off --global"
      reasoning_medium: "/reasoning medium --global"
      reasoning_high: "/reasoning xhigh --global"
      model_max: "/model qwen3.7-max --provider damodel"
      model_pro: "/model deepseek-v4-pro --provider damodel"
      model_flash: "/model deepseek-v4-flash --provider damodel"
      model_mimo: "/model mimo-v2.5-pro --provider xiaomi --global"
      model_minimax: "/model MiniMax-M3 --provider minimax-cn --global"
      list_models: "/providers"
      yolo_on: "/yolo on"
      yolo_off: "/yolo off"
      inspect_gpu_cluster: "帮我根据 sre-king 启动 GPU 集群巡检流程，先问我 IP 范围，等我确认后再执行"
      sync_git_hermes: "帮我同步 hermes-agent 代码：1) 检查 git status 确认无遗留；2) 按功能拆分成多个有意义的 commit；3) 确认全程在 owner 分支操作；4) push 到 github 和 gitlab。开始前先告诉我你的计划。"
      sync_sre_king: "帮我同步本地 sre-king 目录代码，流程如下：1) 定位本地 sre-king 目录（~/.hermes/skills/westcloud/sre-king/）；2) 检查是否为 git 仓库，不是则停止并提示；3) 检查当前分支对远端是否有 push 权限，无权限则停止并提示；4) 检查本地未提交的改动，按功能合理拆分成一个或多个有意义的 commit；5) git fetch + git pull 同步远端当前分支；6) 如有冲突 → 停下来描述冲突文件，询问我如何解决；无冲突 → 直接 push。开始前先告诉我你的计划，每步执行后汇报结果。"

  # ── Feishu bot menu dedup + ack (per-key feedback for slow bot menu commands) ─
  # Sent immediately after a bot menu click so the user sees feedback before the
  # underlying command (e.g. /new resets the session, which is slow) finishes.
  # 3-second per-(open_id, event_key) dedup is handled in owner/feishu/bot_menu.py.
  # Set ack: null to suppress ack for a specific key; falls back to default_ack.
    bot_menu_dedup:
      enabled: true
      default_ack: "⏳ 已收到…"
      per_key:
        # /new — 重置当前会话。Agent pipeline 耗时较长，提供明确 ack 让用户知道已触发。
        new:
          ack: "🔄 新建会话中…"
        stop:
          ack: "⏹️ 停止当前任务…"
        status:
          ack: null
        reasoning_off:
          ack: "⚙️ 切换推理模式…"
        reasoning_medium:
          ack: "⚙️ 切换推理模式…"
        reasoning_high:
          ack: "⚙️ 切换推理模式…"
        model_flash:
          ack: "🤖 切换模型…"
        model_pro:
          ack: "🤖 切换模型…"
        model_max:
          ack: "🤖 切换模型…"
        model_mimo:
          ack: "🤖 切换 mimo-v2.5-pro…"
        model_minimax:
          ack: "🤖 切换 MiniMax-M3…"
        inspect_gpu_cluster:
          ack: "🔍 启动 GPU 集群巡检流程中…"
        list_models:
          ack: "📋 读取模型列表…"
        yolo_on:
          ack: "🔓 开启 YOLO 模式…"
        yolo_off:
          ack: "🔒 关闭 YOLO 模式…"
        sync_git_hermes:
          ack: "🔄 同步 hermes-agent 仓库…"
        sync_sre_king:
          ack: "📦 同步 sre-king 仓库…"

  # ── Model-level extra_body injection ───────────────────────────────────────
  # Per-provider, per-model extra_body merges. Use the *real* provider name
  # (owner_provider_name) as the key, e.g. xfyun / damodel / deepseek-company.
  # This is injected by owner/extra_body_injection.py in the chat_completions
  # transport, after the provider profile's own extra_body but before request
  # overrides. It lets you turn on provider-specific features like thinking
  # mode for one model without touching the global config.
  model_extra_body:
    xfyun:
      astron-code-latest:
        enable_thinking: true
      # [owner] xfyun 直连端点也需要 enable_thinking
      # 验证 2026-06-12: enable_thinking=true → reasoning_content 填充
      xopglm51:
        enable_thinking: true
      xopglm5:
        enable_thinking: true
      xopkimik26:
        enable_thinking: true
    # [owner] damodel 思考模式配置
    # xopglm51=GLM-5.1 / xopglm5=GLM-5 / xopkimik26=Kimi-K2.6 (讯飞 Coding Plan)
    damodel:
      xopglm51:
        enable_thinking: true
      xopglm5:
        enable_thinking: true
      xopkimik26:
        enable_thinking: true
      # [owner] glm-5.1/glm-5: Coding Plan 端点，使用官方格式 + clear_thinking=false
      # 验证 2026-06-12: thinking.type=enabled → reasoning_content 填满
      glm-5.1:
        thinking:
          type: enabled
          clear_thinking: false
      glm-5:
        thinking:
          type: enabled
          clear_thinking: false
