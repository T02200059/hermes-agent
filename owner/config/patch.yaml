owner:
  feishu_card:
    auto_card_threshold: 57
    split_enabled: true
    split_max_chars: 24000

  # ── Image Generation Presets ───────────────────────────────────────────────
  # Presets for the DashScope image-gen plugin (plugins/image_gen/dashscope/).
  # Select the active preset via config.yaml:
  #   image_gen:
  #     provider: dashscope
  #     model: qwen          # or "wan"
  # Or override per-call by passing model="wan" to the image_generate tool.
  # api_key supports ${ENV_VAR} references; they are expanded at runtime.
  image_gen:
    presets:
      dashscope-qwen:
        alias:
          - qwen
        endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
        model: qwen-image-2.0
        api_key: ${DASHSCOPE_API_KEY}
      dashscope-wan:
        alias:
          - wan
        endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
        model: wan2.6-t2i
        api_key: ${DASHSCOPE_API_KEY}

  # ── Model-level extra_body injection ───────────────────────────────────────
  # Per-provider, per-model extra_body merges. Use the *real* provider name
  # (owner_provider_name) as the key, e.g. xfyun / damodel / deepseek-company.
  # This is injected by owner/extra_body_injection.py in the chat_completions
  # transport, after the provider profile's own extra_body but before request
  # overrides. It lets you turn on provider-specific features like thinking
  # mode for one model without touching the global config.
  model_extra_body:
    xfyun:
      astron-code-latest:
        enable_thinking: true
