# ═══════════════════════════════════════════════════════════════════════════════
# Feishu multi-profile routing configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# ⚠️  本文件是实际在用的配置（通过软链接），不是模板！
#
# 软链接关系：
#   ~/.hermes/patch_feishu_profile.yaml
#   → ~/.hermes/hermes-agent/owner/config/patch_feishu_profile.yaml (本文件)
#
# 内部项目，不需要考虑 git 安全 —— app_id、open_id、api_key 均为真实值。
# 如需脱敏用于分享/开源，另建 template 文件。
#
# Runtime path: ~/.hermes/patch_feishu_profile.yaml
# ═══════════════════════════════════════════════════════════════════════════════

feishu:
  bots:
    cli_a96f6714a2781cb3: # YangtbClawProMax (主 bot WS 在 default 网关)
      user_routing:
        # resolve_profile_route 优先级：
        #   1. whitelist open_id → 主网关 (None，不转发)
        #   2. chat_profile_routes / user_profile_routes
        #   3. default_profile → profile_endpoints 转发
        #   4. 无 route → 主网关
        #
        # 杨天宝在 whitelist → 对话留在主网关 (default)。
        # 其他人走 default_profile → hermesxiyun。
        whitelist:
          - ou_2924a1f56adac3a07a0fef2cea2543c5  # 杨天宝 → 主网关
        # - ou_6cb6f4ab129937d7fbf01bd7bf5cfe8d  # 庭威总
        chat_profile_routes: {}
        user_profile_routes: {}
        default_profile: hermesxiyun
        profile_endpoints:
          hermesxiyun:
            url: http://localhost:26026
            # Must match the container's API_SERVER_KEY (profile .env), else the
            # container's _check_auth rejects forwarded requests with 401.
            api_key: "sk-HpFO0tO2GKpEmkTO4020Cf3454224306B3C11393D22007D9"

  # ── Skill approval (profile-level) ───────────────────────────────────────
  # Strict skill_manage write approval for sub-profile Feishu sessions.
  # When enabled AND active profile ∈ profiles:
  #   - Feishu sessions: skill_manage write actions block for human approval
  #     (skills_list / skill_view / ordinary file tools / terminal: not gated)
  #   - background_review skill evolution forced off (memory review unchanged)
  #   - curator ignored; terminal may still edit skills/ (accepted bypass)
  # Deny/timeout hard-stops the turn. Wait timeout is independent of
  # config.yaml approvals.timeout (default 24h); activity keepalive avoids
  # agent.gateway_timeout inactivity kills during the wait.
  #
  # Approval cards are self-built (owner/feishu/skill_approval_card.py) and
  # sent to approval_home_chat_id.  Button clicks are handled by a dedicated
  # ``hermes_action == "skill_approval_gate"`` dispatch branch.
  #
  # A "waiting for approval" text message is sent to the origin conversation
  # chat so the user knows the agent is blocked.
  skill_approval:
    enabled: false
    # Profile 白名单：命中才启用严格 skill 审批（* = 所有 profile / 容器用户）。
    # 容器场景下每个用户进程都是独立 default，真实身份取 HERMES_PROFILE env，
    # 白名单写 * 表示所有用户（含主 gateway）都启用审批。
    profiles:
      - "*"
    # Skill 白名单（精确名 或 fnmatch glob，如 xy-*）。
    # 原则：仅审查这里配置的 skill_manage 写操作；空列表 = 全部不审。
    # 只 gate skill_manage 等 tool，不 gate terminal 直改 / 手动改。
    allow_skills:
      - xy-*
    # 审批卡片固定发到此群，与触发对话所在群无关。
    approval_home_chat_id: oc_f206b3d2a547a12f430593ea44076031
    # Seconds to wait for approve/deny (default 86400 = 24h).
    timeout_seconds: 86400
    # When true (default), profile-level disable of bg skill review.
    disable_background_skill_review: true

# ═══════════════════════════════════════════════════════════════════════════════
# LDAP 二次认证（api_server 的 X-Hermes-Identity 流量）
# ═══════════════════════════════════════════════════════════════════════════════
#
# 作用面：携带 ``X-Hermes-Identity``（LDAP uid）请求头的 api_server 流量 ——
# 即经 identity_routes 选 profile、反代到子容器的这条链路。
#
# 认证方式：请求头 ``X-Hermes-Identity-Password`` 携带该用户的 LDAP 密码，
# 网关用模板 DN 直接 bind（bind 成功 = 账号存在 + 密码正确，一步完成）。
#
#   - bind 成功   → 该 login 免验 72h（内存 + 状态文件，网关重启不丢）
#   - bind 失败   → 401 拒绝 + 短负缓存防爆破（只有这种"失败"才拒绝）
#   - 无密码请求  → 按 enforce 策略（见下），默认 seen：认证过一次的账号
#                   在缓存过期且无新密码时才 401；从未认证过的账号放行
#                   （api_key 仍是第一信任边界，部署期天然灰度）
#   - LDAP 不可达 → 默认放行并告警（fail_open_on_error 可改为拒绝）
#
# 安全要点（实现侧遵守）：
#   - 密码头在反代转发前剥离，且永不写入日志；
#   - login 值经字符白名单 + RFC4514 转义后才拼入 DN（防 DN 注入）；
#   - 空密码直接 401（LDAP 空密码 = 匿名 bind，会假成功）；
#   - DN 模板锚定 cn=people，cn=deleted 离职账号天然无法通过。
#
# identity 的值须与 identity_routes 的 key（即 LDAP uid）一致。
ldap:
  enabled: true
  host: "10.10.100.150"
  port: 389                      # 636 (LDAPS) 未开放，走内网明文 389
  use_ssl: false
  timeout_seconds: 5
  # 用户 bind DN 模板；{login} = X-Hermes-Identity 的值（须为 LDAP uid）
  user_dn_template: "cn={login},cn=people,dc=westhpc,dc=com"
  # 管理账号（可选，bind 校验主路径不依赖）：用于区分「用户不存在 vs
  # 密码错误」的日志定位，以及后续可能的 group 成员校验。
  admin_dn: "cn=admin,dc=westhpc,dc=com"
  admin_password: "xysl123456"
  # web 管理: https://ldapadmin.westhpc.net/
  # 服务维护: 10.10.100.150 上 cd /app/ldap_docker_compose/ && docker-compose up -d
  #           （配置 /app/ldap_docker_compose/docker-compose.yaml）
  #
  # enforce 三档:
  #   off   - 只验带密码的请求；无密码一律放行（纯增强，无防伪造力）
  #   seen  - 认证过一次的账号：缓存有效或带新密码才放行（默认，匹配
  #           "一次成功维持 72h，失败才拒绝"；从未认证过的账号放行 →
  #           前端没上线密码头之前不会破坏任何现有流量）
  #   always- 所有带 identity 的请求都必须有有效缓存或密码
  enforce: "seen"
  # 一次认证成功后的免验时长（小时）
  cache_ttl_hours: 72
  # 认证失败后的负缓存秒数（同一账号连续错密码时防爆破/防打爆 LDAP）
  negative_cache_seconds: 10
  # LDAP 不可达 / ldap3 未安装时: true=放行(api_key 仍是边界) / false=拒绝
  fail_open_on_error: true
