# Feishu multi-profile routing configuration.
#
# Runtime path: ~/.hermes/patch_feishu_profile.yaml

feishu:
  bots:
    cli_YOUR_APP_ID_HERE:
      user_routing:
        whitelist:
          - ou_YOUR_OPEN_ID_HERE

        chat_profile_routes: {}

        user_profile_routes: {}

        default_profile: hermesxiyun

        profile_endpoints:
          hermesxiyun:
            url: http://localhost:26026
            api_key: ""
