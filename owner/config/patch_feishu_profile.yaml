# Feishu multi-profile routing configuration.
#
# Runtime path: ~/.hermes/patch_feishu_profile.yaml

feishu:
  bots:
    cli_YOUR_APP_ID_HERE: # YangtbClawProMax
      user_routing:
        whitelist:
          - ou_YOUR_OPEN_ID_HERE # 杨天宝
        chat_profile_routes: {}
        user_profile_routes: {}
        default_profile: hermesxiyun
        profile_endpoints:
          hermesxiyun:
            url: http://localhost:26026
            # Must match the container's API_SERVER_KEY (profile .env), else the
            # container's _check_auth rejects forwarded requests with 401.
            api_key: "YOUR_API_KEY_HERE"
    cli_YOUR_APP_ID_HERE: # 毕方
      user_routing:
        whitelist:
          - ou_23270fbce80e70282797919e4b254fa5  # 王庭威
        chat_profile_routes: {}
        user_profile_routes: {}
        default_profile: hermesxiyun
        profile_endpoints:
          hermesxiyun:
            url: http://localhost:26026
            api_key: "YOUR_API_KEY_HERE"
          hermeswangtingwei:
            url: http://localhost:26027
            api_key: "YOUR_API_KEY_HERE"
          hermesyangtb:
            url: http://localhost:26028
            api_key: "YOUR_API_KEY_HERE"
          liruiyang:
            url: http://localhost:26029
            api_key: "YOUR_API_KEY_HERE"
          sunqifei:
            url: http://localhost:26030
            api_key: "YOUR_API_KEY_HERE"
