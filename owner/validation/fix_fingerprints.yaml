# Bug 修复指纹库
#
# 记录 owner 分支已提前修复的 bug。当上游后续也修复同一问题时，
# FingerprintDetector 会基于文件交集率 + 关键词命中率计算相似度，
# 相似度 > 0.5 即在报告中提示"疑似重复修复"，供人工决策
# （删本地取官方 / 融合 / 保留本地）。
#
# Schema 见架构文档 3.2 节：
#   id              : 唯一标识符
#   title           : 人类可读描述
#   owner_commit    : 改动清单章节号（如 "2.2.1"）
#   owner_commit_hash: owner 分支 commit hash（可选）
#   fixed_files     : 本地修复涉及的文件列表（相对仓库根）
#   fix_keywords    : 修复意图关键词列表
#   fix_category    : bugfix | security | enhancement
#   status          : active | superseded | merged_upstream
#                     仅 active 条目参与检测

