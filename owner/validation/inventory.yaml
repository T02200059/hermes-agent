        file: cron/scheduler.py
        contains:
          # Main-native ContextVar set OR residual owner hook both OK.
          - 'HERMES_CRON_SESSION'
          - 'owner.cron.run_job_hook'
          - 'owner_cron_session_exit'
      - type: file_contains
        file: owner/cron/run_job_hook.py
        contains:
          - 'HERMES_CRON_SESSION'
          - 'os.environ.pop("HERMES_CRON_SESSION", None)'
      - type: file_contains
        file: owner/cron/session_context.py
        contains:
          - 'ContextVar("HERMES_CRON_SESSION"'
          - '_VAR_MAP["HERMES_CRON_SESSION"]'
