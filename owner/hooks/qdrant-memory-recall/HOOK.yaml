name: qdrant-memory-recall
version: 0.1.0
description: >
  Per-turn 语义召回：每条飞书消息到达 LLM 之前，从 Qdrant 5 个 collection
  召回语义相关条目，拼成 extra_context 注入到 user message 的当次 LLM 输入。

  注意：extra_context 只对当次 LLM 调用可见，不持久化到 session history。
  多轮召回由后续 message:receive 事件重新触发，不依赖上轮结果。

events:
  - message:receive

# handler 入口：async def handle(event_type, context) -> dict | None
# 返回 {"extra_context": "..."} 会被 gateway 拼到 user message
# 返回 None 表示不注入
handler: handler.py
