name: session-archiver
version: "0.1.0"
description: >
  Archive completed sessions to Qdrant events collection with LLM-generated
  summaries. Fires on on_session_finalize (CLI exit, /new, /reset) for all
  platforms. Reads conversation from state.db, generates Chinese summary via
  DeepSeek V4 Flash, writes dense+sparse vectors to Qdrant.
author: yangtb
hooks:
  - on_session_finalize
provides_hooks:
  - on_session_finalize
