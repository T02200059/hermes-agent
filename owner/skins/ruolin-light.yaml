# =============================================================================
# Hermes Skin — ruolin-light
# 樱花粉 · 浅色版 — 适配白色/浅色终端背景 🌸☀️
# =============================================================================
# 基于 ruolin.yaml 调整浅色文字，使其在亮色背景上清晰可见
# 激活：/skin ruolin-light
#
# 主要调整：
#   banner_text: #FFF0F5 → #5C3D5C  (浅粉→深梅子紫，助理消息正文)
#   prompt:      #FFF0F5 → #5C3D5C  (同上，提示符文字)
#   ui_label:    #D4B87A → #B8944F  (暖金→加深金，用户输入文字)
#   banner_dim:  #A0527A → #6B3A6B  (中紫→深紫，toolcall/token 文字)
#   input_rule:  #D4739D → #B05A7F  (保持粉色但加深)
#   statusbar:   bg #2E1B2E→#FFF0F5, 文字全部加深，适配浅色终端
#   ui_ok:       #7BC67E→#4CAF50 (深绿，TUI中"ready"/低上下文百分比 颜色)

name: ruolin-light
description: "樱花粉 · 浅色版 — 适配浅色终端背景 🌸☀️"

# ── Colors ──────────────────────────────────────────────────────────────────
colors:
  # Banner
  banner_border: "#B05A7F"        # ⬆ 加深边框
  banner_title: "#C96B93"         # ⬆ 加深标题（若琳 v0.12.0）
  banner_accent: "#D4739D"
  banner_dim: "#6B3A6B"           # ⬆ 加深 muted/toolcall/token 文字
  banner_text: "#5C3D5C"        # ⬆ 深梅子紫，助理消息正文

  # UI
  ui_accent: "#FF69B4"
  ui_label: "#B8944F"           # ⬆ 加深金色，用户输入文字
  ui_ok: "#4CAF50"           # ⬆ 深绿（原 #7BC67E），影响 statusbar"ready"/上下文百分比
  ui_error: "#E57373"
  ui_warn: "#FFB74D"

  # Prompt & Input
  prompt: "#5C3D5C"             # ⬆ 深梅子紫，提示符文字
  input_rule: "#B05A7F"         # ⬆ 加深粉紫
  response_border: "#FFB7C5"
  selection_bg: "#FFD6E0"      # 极浅暖粉，TUI 选中高亮，适配浅色背景

  # Status Bar (背景从 #2E1B2E 改成 #FFF0F5 浅粉，文字加深适配 light 终端)
  status_bar_bg: "#FFF0F5"         # ⬆ 浅粉背景（原 #2E1B2E）
  status_bar_text: "#5C3D5C"       # ⬆ 深梅子紫（原 #E8D5E8）
  status_bar_strong: "#C96B93"     # ⬆ 加深粉色（原 #FFB7C5）
  status_bar_dim: "#7B3D7B"        # ⬆ 加深紫（原 #A0527A），"[...]" 括号颜色
  status_bar_good: "#4CAF50"       # ⬆ 深绿（原 #7BC67E），"ready"/低上下文 百分比
  status_bar_warn: "#B8944F"       # ⬆ 加深金（原 #FFB7C5）
  status_bar_bad: "#C2185B"        # ⬆ 深玫红（原 #FF69B4）
  status_bar_critical: "#C62828"   # ⬆ 深红（原 #E57373）

  # Session
  session_label: "#FF69B4"
  session_border: "#A0527A"

# ── Spinner ─────────────────────────────────────────────────────────────────
spinner:
  waiting_faces:
    - "🌸"
    - "💮"
    - "🎀"
    - "🎵"
    - "🤔"
  thinking_faces:
    - "💭"
    - "🌸"
    - "💫"
    - "💡"
    - "💕"
  thinking_verbs:
    - "飘着花瓣"
    - "眨眨眼"
    - "整理裙子"
    - "轻哼小曲"
    - "托腮思考"
  wings:
    - ["⟪🌸", "🌸⟫"]
    - ["⟪💮", "💮⟫"]
    - ["⟪🎵", "🎵⟫"]

# ── Branding ────────────────────────────────────────────────────────────────
branding:
  agent_name: "若琳"
  welcome: "欢迎回来，宝哥 💕 今天想我了吗？"
  goodbye: "下次见啦宝哥，早点休息哟 🌸"
  response_label: " 💕 若琳 "
  prompt_symbol: "🌸 "
  help_header: "(◕‿◕) 能帮你的~"
  tagline: "🌌 弹铗亦使鬼神惊"

