# =============================================================================
# Hermes Skin - ruolin-light
# 樱花粉亮色版 · Sakura Pink Light - 适合浅色终端的若琳主题 🌸
# =============================================================================
# All fields are optional. Missing values inherit from default.
# Activate with: /skin ruolin-light  (in CLI)
# Or set: display.skin: ruolin-light  (in config.yaml)

name: ruolin-light
description: "樱花粉亮色版 · Sakura Pink Light - 适合浅色终端 🌸"

# ── Colors ──────────────────────────────────────────────────────────────────
colors:
  # Banner - 中等饱和粉色在浅底上可见，保持不变
  banner_border: "#D4739D"
  banner_title: "#FFB7C5"
  banner_accent: "#FF69B4"
  banner_dim: "#6B3A6B"
  banner_text: "#5C3D5C"

  # UI - 加深以保证浅底对比度
  ui_accent: "#FF69B4"
  ui_label: "#B8944F"
  ui_ok: "#4CAF50"
  ui_error: "#E57373"
  ui_warn: "#FFB74D"

  # Prompt & Input - 深色文字
  prompt: "#5C3D5C"
  input_rule: "#B05A7F"
  response_border: "#FFB7C5"

  # Status Bar - 浅粉底 + 深色文字
  status_bar_bg: "#FFF0F5"
  status_bar_text: "#5C3D5C"
  status_bar_strong: "#C96B93"
  status_bar_dim: "#7B3D7B"
  status_bar_good: "#4CAF50"
  status_bar_warn: "#B8944F"
  status_bar_bad: "#C2185B"
  status_bar_critical: "#C62828"

  # Session
  session_label: "#C96B93"
  session_border: "#7B3D7B"

  # Selection & Completion (skin engine 新增字段)
  selection_bg: "#FFD6E0"
  voice_status_bg: "#FFF0F5"
  completion_menu_bg: "#F8F0F5"
  completion_menu_current_bg: "#FFD6E0"
  completion_menu_meta_bg: "#F0E8EF"
  completion_menu_meta_current_bg: "#FFC4D4"

# ── Spinner ─────────────────────────────────────────────────────────────────
spinner:
  waiting_faces:
    - "🌸"
    - "💮"
    - "🎀"
    - "🎵"
    - "🤔"
  thinking_faces:
    - "💭"
    - "🌸"
    - "💫"
    - "💡"
    - "💕"
  thinking_verbs:
    - "飘着花瓣"
    - "眨眨眼"
    - "整理裙子"
    - "轻哼小曲"
    - "托腮思考"
  wings:
    - ["⟪🌸", "🌸⟫"]
    - ["⟪💮", "💮⟫"]
    - ["⟪🎵", "🎵⟫"]

# ── Branding ────────────────────────────────────────────────────────────────
branding:
  agent_name: "若琳"
  welcome: "欢迎回来，宝哥 💕 今天想我了吗？"
  goodbye: "下次见啦宝哥，早点休息哟 🌸"
  response_label: " 💕 若琳 "
  prompt_symbol: "🌸 "
  help_header: "(◕‿◕) 能帮你的~"
  tagline: "🌌 弹铗亦使鬼神惊"

