name: owner-extensions
version: 0.1.0
description: >-
  Owner-branch runtime patches (memory synthetic guard, /providers command,
  schema patches, OpenViking recall), Feishu memory write-approval cards,
  and Feishu skill_manage write approval (profile whitelist).
author: "owner"
hooks:
  - pre_gateway_dispatch   # capture gateway → adapter reference (memory / skill gate)
  - pre_tool_call          # skill_manage Feishu write approval
  - post_tool_call         # detect staged memory writes → approval card
  - transform_llm_output   # output_guard: LLM 输出复读/乱码/超长检测与折叠
  - on_stream_delta        # stream_guard: 生成中退化（思考/输出边界循环）检测与中止
  - on_stream_delta        # progress_explainer: 沉默期进度旁白的流增量观察
