# =============================================================================
# Hermes 基础配置范例（脱敏 / 去平台 / 去模型强关联）
# =============================================================================
#
# 来源：从 ~/.hermes/config.yaml（运行时配置）梳理而来。
# 用途：作为「只关心 Hermes 行为与运行时基础」的参考模板；
#       复制到 ~/.hermes/config.yaml 后，再自行补模型、密钥、平台与插件。
#
# 密钥请放 ~/.hermes/.env，不要写进本文件。
#
# -----------------------------------------------------------------------------
# 本范例相对运行时配置「去掉了什么」
# -----------------------------------------------------------------------------
#
# 【密钥 / 凭证 / 身份】
#   - 所有 API Key 字面量、api_key 字段
#   - dashboard.oauth / basic_auth 凭据字段
#   - secrets.bitwarden 项目细节（仅保留开关结构说明，见文末注释）
#   - FEISHU_HOME_CHANNEL / QQBOT_HOME_CHANNEL 等频道 ID
#   - hooks 中指向本机私有脚本的绝对路径
#
# 【模型 / 供应商强关联】
#   - model.default / model.provider 具体取值
#   - providers 整段（damodel / deepseek / openrouter / xai / volcengine-ark 等
#     及各自 base_url、models 目录、context_length）
#   - openrouter / bedrock 供应商专用段
#   - auxiliary.* 里每个侧任务的 provider / model 绑定
#   - moa.presets 中的 reference_models / aggregator 具体模型
#   - model_aliases（如 grok / mimo / qwen 快捷别名）
#   - x_search.model 具体模型名
#   - quick_commands 里依赖具体模型的别名（如 modelmimo）
#   - image_gen.provider 具体后端名
#   - memory.provider 具体后端名（openviking 等）
#   - cron.provider、cron.chronos 门户/回调 URL
#   - tts / stt 中绑定到某一厂商的 voice_id / model 目录
#
# 【平台 / 消息通道强关联】
#   - display.platforms 下 telegram / discord / feishu / qqbot 覆盖
#   - slack / discord / telegram / mattermost / matrix 顶层平台段
#   - feishu.channel_prompts（含群 ID 与人设文案）
#   - platform_toolsets 中除通用 cli 外的平台条目（如 feishu）
#
# 【环境 / 本机 / 个性化强关联】
#   - web.search_backend / extract_backend 具体服务选型
#   - mcp_servers 本机命令与 CDP 端点（playwright localhost 等）
#   - display.skin 自定义皮肤名
#   - display.language 个人语言偏好（如需可自行加回）
#   - onboarding.seen 本机引导状态
#   - pet 具体 slug、dashboard.theme 等高度个人偏好（保留结构注释）
#
# 【显式保留（虽略偏个性化）】
#   - agent.reasoning_effort: xhigh
#   - plugins.enabled 中的私有/定制插件名
#
# 【保留原则】
#   只留 Hermes 核心行为：agent 循环、终端沙箱、压缩、审批、安全、
#   工具输出、会话、网关通用、日志、LSP、技能/策展等与「用哪家模型、
#   连哪个 IM」无关的旋钮。
#
# =============================================================================

# 配置 schema 版本（与当前 hermes_cli/config.py DEFAULT_CONFIG 对齐时再核对）
_config_version: 33

# -----------------------------------------------------------------------------
# 会话与工具集（通用）
# -----------------------------------------------------------------------------
toolsets:
  - hermes-cli

# 内存中可同时挂起的 TUI/桌面/dashboard 会话软上限；0/null 关闭
max_live_sessions: 16

# 可选：全局并发会话硬顶（CLI + TUI + 消息网关）。None/0 = 不限制
# max_concurrent_sessions: null

# -----------------------------------------------------------------------------
# Agent 核心循环
# -----------------------------------------------------------------------------
agent:
  max_turns: 120
  # 网关侧：agent 完全空闲多久后超时（秒）；0 = 不限
  gateway_timeout: 1800
  # 停止/重启时等待在途任务的优雅窗口（秒）；0 = 立即 interrupt
  restart_drain_timeout: 300
  api_max_retries: 3
  service_tier: ""
  # auto | true | false | 模型名子串列表
  tool_use_enforcement: auto
  # 意图已表态但未真正调工具时的自动续写
  intent_ack_continuation: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  environment_hint: ""
  # auto | focus | on | off — 编码工作区系统提示姿态
  coding_context: auto
  # coding_instructions: ""   # 项目级编码操作说明（可选）
  verify_on_stop: true
  verify_guidance: true
  max_verify_nudges: 3
  gateway_timeout_warning: 900
  clarify_timeout: 3600
  gateway_notify_interval: 600
  gateway_auto_continue_freshness: 3600
  # auto | native | text — 用户附图如何交给主模型
  image_input_mode: auto
  disabled_toolsets: []
  # 推理强度：取值依赖具体模型档位（low / medium / high / xhigh 等）
  reasoning_effort: xhigh

# -----------------------------------------------------------------------------
# 终端 / 代码执行后端
# -----------------------------------------------------------------------------
terminal:
  backend: local          # local | docker | ssh | modal | daytona | singularity
  modal_mode: auto
  cwd: ~/.hermes          # 消息网关默认工作目录；CLI 仍用进程 cwd
  timeout: 180
  daemon_term_grace_seconds: 2.0
  env_passthrough: []
  home_mode: auto         # auto | real | profile
  shell_init_files: []
  auto_source_bashrc: true
  # 容器类后端镜像（local 忽略）
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  docker_forward_env: []
  singularity_image: docker://nikolaik/python-nodejs:python3.11-nodejs20
  modal_image: nikolaik/python-nodejs:python3.11-nodejs20
  daytona_image: nikolaik/python-nodejs:python3.11-nodejs20
  container_cpu: 1
  container_memory: 5120      # MB
  container_disk: 51200       # MB
  container_persistent: true
  docker_volumes: []
  docker_mount_cwd_to_workspace: false
  docker_extra_args: []
  docker_run_as_host_user: false
  persistent_shell: true

code_execution:
  mode: project             # 执行上下文模式

# -----------------------------------------------------------------------------
# Web / Browser（不绑定具体搜索/抽取服务）
# -----------------------------------------------------------------------------
web:
  backend: ""               # 搜索+抽取共用后端；空 = 按环境自动/默认
  search_backend: ""        # 例：searxng / tavily / ...
  extract_backend: ""       # 例：native / tavily / ...

browser:
  inactivity_timeout: 120
  command_timeout: 30
  record_sessions: false
  allow_private_urls: false
  engine: auto              # auto | chrome | lightpanda
  auto_local_for_private_urls: true
  cdp_url: ""               # 可选：附着已有 Chromium 的 CDP
  dialog_policy: must_respond
  dialog_timeout_s: 300
  camofox:
    managed_persistence: false
    user_id: ""
    session_key: ""
    adopt_existing_tab: false
    rewrite_loopback_urls: false
    loopback_host_alias: host.docker.internal

# -----------------------------------------------------------------------------
# 文件系统检查点 / 工具 I/O 护栏
# -----------------------------------------------------------------------------
checkpoints:
  enabled: true
  max_snapshots: 20
  max_total_size_mb: 500
  max_file_size_mb: 10
  auto_prune: false
  retention_days: 7
  delete_orphans: true
  min_interval_hours: 24

file_read_max_chars: 100000
mcp_discovery_timeout: 1.5

tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

tools:
  tool_search:
    enabled: auto
    threshold_pct: 10
    search_default_limit: 5
    max_search_limit: 20

# -----------------------------------------------------------------------------
# 上下文压缩 / 引擎
# -----------------------------------------------------------------------------
compression:
  enabled: true
  threshold: 0.75
  target_ratio: 0.35
  protect_last_n: 20
  protect_first_n: 3
  hygiene_hard_message_limit: 5000
  abort_on_summary_failure: false
  codex_gpt55_autoraise: true
  in_place: true

context:
  engine: compressor

prompt_caching:
  cache_ttl: 5m

# -----------------------------------------------------------------------------
# 内存（不绑定具体 memory provider）
# -----------------------------------------------------------------------------
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: true
  memory_char_limit: 2200
  user_char_limit: 1375
  # provider: ""            # 例：honcho / mem0 / openviking / ... 按需配置

# -----------------------------------------------------------------------------
# 委派 / Kanban / Goals / MoA 结构（不绑模型）
# -----------------------------------------------------------------------------
delegation:
  model: ""
  provider: ""
  base_url: ""
  api_key: ""               # 密钥请走 .env，勿写明文
  api_mode: ""
  inherit_mcp_toolsets: true
  max_iterations: 50
  child_timeout_seconds: 600
  reasoning_effort: ""
  max_concurrent_children: 3
  max_spawn_depth: 2
  orchestrator_enabled: true
  subagent_auto_approve: false

kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  failure_limit: 2
  worker_log_rotate_bytes: 2097152
  worker_log_backup_count: 1
  orchestrator_profile: ""
  default_assignee: ""
  auto_decompose: true
  auto_decompose_per_tick: 3
  dispatch_stale_timeout_seconds: 14400

goals:
  max_turns: 20

moa:
  default_preset: default
  active_preset: ""
  # presets: 自行按 provider/model 填充，范例不写死模型名

prefill_messages_file: ""

# -----------------------------------------------------------------------------
# 技能 / 策展
# -----------------------------------------------------------------------------
skills:
  external_dirs: []
  template_vars: true
  inline_shell: false
  inline_shell_timeout: 10
  guard_agent_created: false
  write_approval: false

curator:
  enabled: true
  interval_hours: 168
  min_idle_hours: 2
  stale_after_days: 30
  archive_after_days: 90
  consolidate: true
  prune_builtins: true
  backup:
    enabled: true
    keep: 5

# -----------------------------------------------------------------------------
# 展示（CLI/TUI 通用；去掉平台覆盖与个性化皮肤）
# -----------------------------------------------------------------------------
display:
  compact: false
  personality: kawaii
  resume_display: full
  resume_exchanges: 10
  resume_max_user_chars: 300
  resume_max_assistant_chars: 200
  resume_max_assistant_lines: 3
  resume_skip_tool_only: true
  busy_input_mode: steer
  interface: cli              # cli | tui 等
  tui_auto_resume_recent: false
  tui_agents_nudge: true
  bell_on_complete: false
  show_reasoning: true
  reasoning_full: false
  reasoning_style: code
  memory_notifications: "on"
  streaming: true
  timestamps: false
  final_response_markdown: strip
  persistent_output: true
  persistent_output_max_lines: 200
  persist_prompts: true
  inline_diffs: true
  file_mutation_verifier: false
  credits_notices: true
  turn_completion_explainer: true
  show_cost: true
  # skin: default             # 皮肤名；自定义皮肤放 ~/.hermes/skins/
  # language: en
  tui_status_indicator: kaomoji
  cli_refresh_interval: 1
  user_message_preview:
    first_lines: 2
    last_lines: 2
  interim_assistant_messages: true
  tool_progress_command: false
  tool_preview_length: 0
  tool_progress_grouping: accumulate
  tool_progress: all
  friendly_tool_labels: true
  ephemeral_system_ttl: 0
  runtime_footer:
    enabled: true
    fields:
      - model
      - context_pct
      - cwd
  copy_shortcut: auto
  background_process_notifications: false
  long_running_notifications: true
  # pet:                      # 可选桌宠
  #   enabled: false

privacy:
  redact_pii: false

# -----------------------------------------------------------------------------
# 语音输入（通用按键；TTS/STT 厂商绑定见文末「自行补全」）
# -----------------------------------------------------------------------------
voice:
  record_key: ctrl+b
  max_recording_seconds: 120
  auto_tts: false
  beep_enabled: true
  silence_threshold: 200
  silence_duration: 3

human_delay:
  mode: "off"
  min_ms: 800
  max_ms: 2500

# -----------------------------------------------------------------------------
# 审批 / 安全 / 命令白名单
# -----------------------------------------------------------------------------
approvals:
  mode: smart               # smart | always | never 等
  timeout: 3600
  cron_mode: deny
  mcp_reload_confirm: true
  destructive_slash_confirm: false

command_allowlist: []

# 示例：快捷命令结构（勿放密钥；模型相关别名自行加）
quick_commands:
  s:
    target: /status
    type: alias
  # gwrestart:
  #   command: hermes gateway restart
  #   type: exec

hooks_auto_accept: true
# hooks:                      # 需要时再挂 pre_tool_call 等
#   pre_tool_call: []

security:
  allow_private_urls: false
  redact_secrets: false
  tirith_enabled: true
  tirith_path: tirith
  tirith_timeout: 5
  tirith_fail_open: true
  website_blocklist:
    enabled: false
    domains: []
    shared_files: []
  acked_advisories: []
  allow_lazy_installs: true

# -----------------------------------------------------------------------------
# Cron（调度行为；不绑模型/门户）
# -----------------------------------------------------------------------------
cron:
  provider: ""
  wrap_response: true
  mirror_delivery: false
  max_parallel_jobs: 5
  output_retention: 50

# -----------------------------------------------------------------------------
# 日志 / 网络 / 会话 / 流式
# -----------------------------------------------------------------------------
logging:
  level: INFO
  max_size_mb: 5
  backup_count: 3

network:
  force_ipv4: false

gateway:
  scale_to_zero:
    idle_timeout_minutes: 5
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 10

streaming:
  enabled: false
  transport: auto
  edit_interval: 0.8
  buffer_threshold: 24
  cursor: " ▉"
  fresh_final_after_seconds: 0

sessions:
  auto_prune: false
  retention_days: 0
  vacuum_after_prune: true
  min_interval_hours: 24
  write_json_snapshots: false

updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash

# -----------------------------------------------------------------------------
# LSP / 粘贴折叠 / Computer Use
# -----------------------------------------------------------------------------
lsp:
  enabled: true
  wait_mode: document
  wait_timeout: 5
  install_strategy: auto

paste_collapse_threshold: 5
paste_collapse_threshold_fallback: 5
paste_collapse_char_threshold: 2000

computer_use:
  cua_telemetry: false

timezone: ""

# 模型目录拉取（官方目录 URL，非个人密钥）
model_catalog:
  enabled: true
  url: https://hermes-agent.nousresearch.com/docs/api/model-catalog.json
  ttl_hours: 1

# 插件开关（含本 fork 常用私有/定制插件；可按环境删减）
plugins:
  disabled: []
  enabled:
    - hermes-achievements
    - image-hub
    - owner-extensions

# 平台 → toolset 映射：范例只保留 cli；消息平台按需追加
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
    - x_search

# =============================================================================
# 以下段在运行时配置中存在，但属于「模型 / 平台 / 本机环境」层，
# 故不写进本基础范例。需要时从你的 config.yaml 或官方文档补回：
#
# model: / providers: / fallback_providers: / credential_pool_strategies:
# openrouter: / bedrock: / auxiliary: / model_aliases: / x_search:
# tts: / stt: / image_gen: / mcp_servers: / dashboard:
# slack: / discord: / telegram: / mattermost: / matrix: / feishu:
# FEISHU_* / QQBOT_* 等通道 ID
# hooks:（含本机脚本路径）
# secrets:（Bitwarden 等）
# =============================================================================
