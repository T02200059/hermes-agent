pre-commit:
  jobs:
    - name: lint python
      glob: "*.py" # glob filter
      run: ruff check --config ./ruff.pre-commit.toml {staged_files}

    - name: lint web
      root: web/
      glob: "web/**/*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint bootstrap installer
      root: apps/bootstrap-installer/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint desktop app
      root: apps/desktop/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint tui
      root: ui-tui/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint shared
      root: apps/shared/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint tests
      root: tests-js/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: owner marker check
      # Check 8 (v2): official files modified vs the local `main` baseline must
      # carry an [owner] marker (owner/docs/二次开发规范.md §2.2). The script
      # reads the git index itself, so it stays incremental and fast; it fails
      # open in clones without a local `main`. Full audit: --all.
      run: python3 owner/validation/check_owner_markers.py --staged
